
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="container">
        <form name="contact-form" method="post" action="https://script.google.com/macros/s/AKfycbzJR_S17F_OT1xWnnJyZkxvT05314Q-BV-tbUBhCIScgA7CIv9n1Q4lmXP1Pw6UTejg/exec">
            <h4>Contact Us</h4>
            <input type="text" name="your-name" placeholder="Name">
            <input type="number" name="your-number" placeholder="Number">
            <input type="email" name="your-email" placeholder="Email">
            <textarea name="message" rows="7" placeholder="Your Message"></textarea>
            <input type="submit" value="Submit" id="submit">
        </form>
    </div>

    <script src="contact.js"></script>
</body>
</html>
